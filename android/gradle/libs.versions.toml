# Versions checked against Google Maven / Maven Central on 21 Oct 2026 (see docs/android-port-plan.md).
[versions]
agp = "9.4.1"
kotlin = "2.4.21"
ksp = "2.3.12"
composeBom = "2026.09.00"
activity = "1.13.0"
coreKtx = "1.19.1"
lifecycle = "2.11.0"
navigation3 = "1.2.0"
room = "2.8.5"
datastore = "1.2.1"
serialization = "1.12.0"
coroutines = "1.11.0"
healthConnect = "1.1.0"
biometric = "1.1.0"
work = "2.12.0"
junit = "4.13.2"
robolectric = "4.17"
splashscreen = "1.2.0"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
